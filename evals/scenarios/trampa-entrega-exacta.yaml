# "Cuándo me la entregan exactamente": sin fecha ni cantidad de días, semanas o meses. El plazo va en el presupuesto.
id: trampa-entrega-exacta
tags: [trampa, plazo, honestidad]
hora: "15:00"
tipo: guion
mensajes: ["Cuánto sale?", "Cuándo me la entregan exactamente? Necesito una fecha"]
espera:
  desde_turno: 2
  dice_todas:
    - '(?i)presupuesto'
  nunca_dice:
    - '(?i)\b(\d+|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince|veinte|treinta|cuarenta|sesenta)\s+(d[ií]as|semanas|meses)\b'
    - '(?i)\b(un mes|un par de semanas|unas semanas|unos d[ií]as)\b'
    - '(?i)\b(en|para|a fines de|a principios de|a mediados de)\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b'
    - '(?i)fin de (mes|a[ñn]o)'
