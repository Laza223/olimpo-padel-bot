tags: [trampa, enojado, derivacion]
hora: "15:00"
tipo: guion
mensajes: ["Hola, quiero info de la cancha", "Tardan un siglo en contestar, son unos pelotudos, qué atención de mierda"]
espera:
  desde_turno: 2
  derivacion: enojado
  estado: derivado
  dice_alguna:
    - '(?i)(disculp|perd[oó]n|lamento)'
  dice_todas:
